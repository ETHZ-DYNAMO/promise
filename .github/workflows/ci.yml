name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel a run when a newer commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Ubuntu 24.04 provides CMake 3.28 (required by Yosys) and Boost 1.83
    # (Promise requires >= 1.82).
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out Promise and its submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ninja-build cmake pkg-config \
            libeigen3-dev libboost-filesystem-dev libboost-graph-dev \
            libboost-json-dev libboost-program-options-dev \
            bison flex libfl-dev libreadline-dev gawk tcl-dev libffi-dev zlib1g-dev \
            python3 help2man perl autoconf

      # rIC3 uses unstable Rust features.
      - name: Install Rust nightly (the version build.sh uses for rIC3)
        run: rustup toolchain install nightly-2025-06-26 --profile minimal

      - name: Build
        run: bash build.sh

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
